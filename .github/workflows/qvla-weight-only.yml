name: Weight-only QVLA checks

on:
  push:
    paths: ["openvla/qvla/**", "openvla-oft/qvla/**", "openvla/pyproject.toml", "openvla-oft/pyproject.toml", "scripts/run_qvla.py", "tests/**", ".github/workflows/qvla-weight-only.yml"]
  pull_request:
    paths: ["openvla/qvla/**", "openvla-oft/qvla/**", "openvla/pyproject.toml", "openvla-oft/pyproject.toml", "scripts/run_qvla.py", "tests/**", ".github/workflows/qvla-weight-only.yml"]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: openvla
            transformers: transformers==4.40.1
          - backend: openvla-oft
            transformers: transformers @ git+https://github.com/moojink/transformers-openvla-oft.git@bc339d9ad707454c0c115970db43c260067c61ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install isolated CPU dependencies
        run: |
          python -m pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy<2' pillow pytest ruff==0.9.10 huggingface-hub==0.25.2 "${{ matrix.transformers }}"
      - name: Check standalone entrypoint and artifact guards
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          ruff check scripts/run_qvla.py tests --select E9,F,I
          ruff format scripts/run_qvla.py tests --check
          python -m pytest tests -q
      - name: Check backend math and inference semantics
        working-directory: ${{ matrix.backend }}
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
        run: |
          ruff check qvla
          ruff format qvla --check
          python -m pytest qvla/tests -q
